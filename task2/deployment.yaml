apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-app
  labels:
    app: insuretech-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-app
  template:
    metadata:
      labels:
        app: insuretech-app
    spec:
      containers:
      - name: insuretech-app
        image: scaletestapp:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "20Mi"
            cpu: "100m"
          limits:
            memory: "30Mi"
            cpu: "200m"

